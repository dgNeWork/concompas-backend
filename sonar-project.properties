sonar.projectKey=dgNeWork_concompas-backend
sonar.organization=dgnework

sonar.sources=src
sonar.exclusions=src/**/*.spec.ts

# Archivos que se siguen analizando (bugs, code smells, duplicados) pero que no
# cuentan para el porcentaje de cobertura. Son los mismos que Jest ya excluye en
# "collectCoverageFrom" (package.json): arranque de la app, módulos de Nest
# (solo cablean dependencias), DTOs y tipos (validación declarativa de Zod e
# interfaces) y los mocks de apoyo a los tests. Sin esto, Sonar los cuenta como
# 0% porque no aparecen en lcov.info, y la cobertura real queda infravalorada.
sonar.coverage.exclusions=src/main.ts,src/**/*.module.ts,src/**/*.dto.ts,src/**/*.types.ts,src/test-utils/**

sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
